name: Build/Release Wapify Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/desktop
          # Install without running postinstall scripts first
          npm install --ignore-scripts
        env:
          CXXFLAGS: "-std=c++20"
          LDFLAGS: "-std=c++20"
          CL: "/std:c++20"

      - name: Rebuild Native Modules
        run: |
          cd apps/desktop
          npx electron-builder install-app-deps
        shell: bash
        env:
          # Standard Unix-like flags
          CXXFLAGS: "-std=c++20"
          LDFLAGS: "-std=c++20"
          # Windows MSVC specific flags
          CL: "/std:c++20"
          GYP_MSVS_VERSION: "2022"
          # Force node-gyp to respect the standard
          npm_config_std: "c++20"
          npm_config_msvs_version: "2022"

      - name: Build Application
        run: |
          cd apps/desktop
          npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Publish Release to Public Repo
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # Gunakan RELEASE_TOKEN untuk bisa upload ke repo lain
          github_token: ${{ secrets.RELEASE_TOKEN }}
          repository: abdullahPrasetio/wapify-desktop-releases
          package_root: apps/desktop
          # Tambahkan ini agar sinkron dengan GitHub Release
          release: true
          # Build hanya untuk OS yang sedang berjalan di matrix
          args: --${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win' || 'mac') }} --publish always
        env:
          # Memberitahu electron-builder untuk upload ke repo publik
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
