name: Build/Release Wapify Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  docker-backend-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend-client
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LICENSE_PUBLIC_KEY=${{ secrets.LICENSE_PUBLIC_KEY }}
          tags: |
            abdullahprasetio/wapbolt-backend-client:${{ github.ref_name }}
            abdullahprasetio/wapbolt-backend-client:latest

  docker-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push landing page
        uses: docker/build-push-action@v5
        with:
          context: ./apps/landing-page
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_LICENSE_API=${{ secrets.VITE_LICENSE_API || 'https://wapbolt-api.temancode.my.id' }}
          tags: |
            abdullahprasetio/wapbolt-landing:${{ github.ref_name }}
            abdullahprasetio/wapbolt-landing:latest

  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/desktop
          # Standard install, ignoring postinstall to avoid automatic rebuild
          npm install --ignore-scripts

      - name: Rebuild Native Modules
        run: |
          cd apps/desktop
          # Only rebuild the modules we actually use in Electron
          npx @electron/rebuild --only keytar
        shell: bash

      - name: Build Application
        run: |
          cd apps/desktop
          npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Publish Release to Public Repo
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # Gunakan RELEASE_TOKEN untuk bisa upload ke repo lain
          github_token: ${{ secrets.RELEASE_TOKEN }}
          repository: abdullahPrasetio/wapbolt-desktop-releases
          package_root: apps/desktop
          # Tambahkan ini agar sinkron dengan GitHub Release
          release: true
          # Build hanya untuk OS yang sedang berjalan di matrix
          args: --${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win' || 'mac') }} --publish always
        env:
          # Memberitahu electron-builder untuk upload ke repo publik
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
