name: Build/Release Wapify Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      # max-parallel: 1 — same race-condition fix as build-local.yml: 3 OS
      # runners publishing to the same GitHub release tag in parallel can
      # each try to create it (no atomic create-if-not-exists), producing
      # duplicate draft releases. Sequential matrix means the first job
      # creates the release, the rest find and reuse it.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'
          # Sejak monorepo npm workspaces (Fase 0 Wapbolt Local), lockfile
          # tunggal ada di root — bukan apps/desktop/package-lock.json lagi.
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (workspace root)
        # --ignore-scripts: hindari postinstall desktop-local (@electron/rebuild
        # better-sqlite3) yang tidak dibutuhkan utk build app Cloud.
        run: npm ci --ignore-scripts

      - name: Rebuild Native Modules
        run: |
          cd apps/desktop
          npx @electron/rebuild --only keytar
        shell: bash

      - name: Build Application
        run: |
          cd apps/desktop
          npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Package & Publish Release
        # electron-builder.yml sudah memuat target publish
        # (github: abdullahPrasetio/wapbolt-desktop-releases).
        run: |
          cd apps/desktop
          npx electron-builder --${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win' || 'mac') }} --publish always
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
