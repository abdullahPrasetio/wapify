name: Build Wapbolt Local

# Wapbolt Local dirilis terpisah dari app Cloud: tag `local-v*`.
# Installer diunggah ke GitHub Release di REPO INI (bukan
# wapbolt-desktop-releases — repo itu dikonsumsi electron-updater app Cloud;
# release local-v* yang jadi "latest" di sana akan merusak auto-update Cloud).
# v1 tetap tanpa auto-update di dalam app (docs/local-app-design.md).

on:
  push:
    tags:
      - 'local-v*'
  workflow_dispatch:

permissions:
  contents: write # buat GitHub Release + upload asset

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron ABI
        run: |
          cd apps/desktop-local
          npx @electron/rebuild --only better-sqlite3
        shell: bash

      # Vitest TIDAK dijalankan di sini: better-sqlite3 sudah di-rebuild utk
      # ABI Electron (bukan Node), test unit sudah dicover workflow ci.yml.
      - name: Typecheck & Build
        run: |
          cd apps/desktop-local
          npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Package (no publish)
        run: |
          cd apps/desktop-local
          npx electron-builder --${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win' || 'mac') }} --publish never
        shell: bash

      # Artifact workflow: selalu diunggah (termasuk run manual) utk QA.
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wapbolt-local-${{ matrix.os }}
          path: |
            apps/desktop-local/dist/*.dmg
            apps/desktop-local/dist/*.zip
            apps/desktop-local/dist/*.exe
            apps/desktop-local/dist/*.AppImage
            apps/desktop-local/dist/*.deb
          if-no-files-found: error

      # GitHub Release: hanya saat push tag local-v* (bukan run manual).
      # Ketiga job matrix menambahkan asetnya ke release tag yang sama.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/local-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wapbolt Local ${{ github.ref_name }}
          files: |
            apps/desktop-local/dist/*.dmg
            apps/desktop-local/dist/*.zip
            apps/desktop-local/dist/*.exe
            apps/desktop-local/dist/*.AppImage
            apps/desktop-local/dist/*.deb
