name: Build Wapbolt Local

# Wapbolt Local dirilis terpisah dari app Cloud: tag `local-v*`.
# Installer diunggah ke GitHub Release di repo TERPISAH
# (abdullahPrasetio/wapbolt-lite-releases, lihat electron-builder.yml) —
# BUKAN wapbolt-desktop-releases (dikonsumsi electron-updater app Cloud;
# release local-v* di sana bisa merusak auto-update Cloud) dan BUKAN repo
# sumber ini juga (biar histori rilis Local tidak campur dgn kode/PR).
# v1 tetap tanpa auto-update di dalam app (docs/local-app-design.md).

on:
  push:
    tags:
      - 'local-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron ABI
        run: |
          cd apps/desktop-local
          npx @electron/rebuild --only better-sqlite3
        shell: bash

      # Vitest TIDAK dijalankan di sini: better-sqlite3 sudah di-rebuild utk
      # ABI Electron (bukan Node), test unit sudah dicover workflow ci.yml.
      - name: Typecheck & Build
        run: |
          cd apps/desktop-local
          npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      # Publish hanya saat push tag local-v* (bukan run manual/workflow_dispatch).
      # Target repo diambil dari `publish:` di electron-builder.yml.
      - name: Package & Publish
        run: |
          cd apps/desktop-local
          npx electron-builder --${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win' || 'mac') }} --publish ${{ startsWith(github.ref, 'refs/tags/local-v') && 'always' || 'never' }}
        shell: bash
        env:
          # RELEASE_TOKEN: PAT lintas-repo yang sama dipakai build.yml (Cloud) —
          # harus punya akses ke abdullahPrasetio/wapbolt-lite-releases juga.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Artifact workflow: selalu diunggah (termasuk run manual) utk QA cepat
      # tanpa menunggu/membuat release.
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wapbolt-local-${{ matrix.os }}
          path: |
            apps/desktop-local/dist/*.dmg
            apps/desktop-local/dist/*.zip
            apps/desktop-local/dist/*.exe
            apps/desktop-local/dist/*.AppImage
            apps/desktop-local/dist/*.deb
          if-no-files-found: error
