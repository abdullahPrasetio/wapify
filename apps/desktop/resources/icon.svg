      <stop stop-color="#2563EB" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 260) rotate(90) scale(150 200)">
      <stop stop-color="white" stop-opacity="0.5" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
